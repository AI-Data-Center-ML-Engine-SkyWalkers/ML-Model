eia861_pudl:
  name: EIA-861 Annual Electric Power Industry Report (service territory + reliability via Catalyst PUDL stable;
    sales from raw EIA-861 files)
  url: https://s3.us-west-2.amazonaws.com/pudl.catalyst.coop/stable/core_eia861__yearly_{service_territory|reliability}.parquet
    ; https://www.eia.gov/electricity/data/eia861/zip/f8612024.zip ; https://www.eia.gov/electricity/data/eia861/archive/zip/f8612020.zip
  landing_page: https://data.catalyst.coop ; https://www.eia.gov/electricity/data/eia861/
  vintage: EIA-861 2024 (final); 2020 for price growth; reliability 2020-2024
  license: EIA data public domain; PUDL outputs CC-BY-4.0 (Catalyst Cooperative)
  notes: 'APPROXIMATION: utility service territories list every county a utility serves, not how much. Industrial
    price = weighted by each utility''s industrial MWh in the state; bundled price = revenue/sales; delivery-only
    (retail-choice) utilities get their wires charge plus the state''s average energy-only (Part B) industrial price,
    or, where suppliers report all-in service as Part D retail marketers (Texas), the state''s Part D industrial
    price. Federal power marketing administrations (WAPA, BPA, SWPA, SEPA) are excluded from price weighting. Sales
    come from the raw EIA-861 files because PUDL omits Delivery_Companies (Texas TDUs). pwr_saidi_min / pwr_saifi
    = IEEE standard WITHOUT major event days, median of 2020-2024 per utility-state (over the years it reported),
    then simple mean across the county''s utilities; *_with_me_latest = IEEE standard WITH major event days, 2024
    only, same mean. ISO = BA of the county''s largest-sales utility (PJM, ERCO, MISO, SWPP, CISO, NYIS, ISNE; everything
    else NONE). Price growth = state all-sector revenue/(bundled+energy sales), 2020->2024. CT service territories
    are on old counties; a utility serving an old county is mapped to every planning region overlapping it.'
  download_date: '2026-10-03'
  raw_files:
  - data/raw/pudl/core_eia861__yearly_service_territory.parquet
  - data/raw/pudl/core_eia861__yearly_reliability.parquet
  - data/raw/eia861/f8612024.zip
  - data/raw/eia861/f8612020.zip
