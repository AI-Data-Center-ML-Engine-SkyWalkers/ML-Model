usgs_padus:
  name: USGS Protected Areas Database of the US (PAD-US) 4.1 - Combined layer
  url: https://data.source.coop/cboettig/padus/padus-4-1/combined.parquet
  landing_page: https://source.coop/cboettig/padus ; https://www.usgs.gov/programs/gap-analysis-project/science/pad-us-data-download
  vintage: PAD-US 4.1
  license: Public domain (USGS); source.coop mirror by C. Boettiger
  notes: 'Combined layer (Fee, Easement, Designation, Proclamation) filtered to GAP_Sts in [''1'', ''2''] within
    the CONUS bbox (121534 features), Marine category dropped (120670 kept). Overlaps dissolved per county before
    measuring, so area is not double counted. Denominator = cb_2025 500k county area incl. inland water. CAVEAT:
    some Designation polygons are proclamation boundaries rather than protected land, e.g. San Juan Islands National
    Monument (GAP 2, 432,005 acres) covers all of San Juan County WA, which therefore shows 100%. Kept as published;
    no ad hoc filter applied.'
  download_date: '2026-10-04'
  raw_files:
  - data/raw/padus/padus-4-1_combined.parquet
usgs_water_use:
  name: USGS National Water Availability Assessment (NWAA) Data Companion - water-use models
  url: https://api.water.usgs.gov/nwaa-data/data?model={wu-public-supply-wd,wu-irrigation-wd,wu-thermoelectric}&location=stateCd:XX&timeres=annualcy&startdate=2020
  landing_page: https://water.usgs.gov/nwaa-data/
  vintage: NWDC API v2.1.0, calendar year 2020
  license: Public domain (USGS)
  notes: 528 cached API pages in data/raw/usgs_nwaa.
    The NWAA models are HUC12-only (no county table), so HUC12 annual mean withdrawals (Mgal/d) are split onto counties
    by the share of each HUC12's area that falls in the county (EPSG:5070); assumes withdrawals are uniform within
    a HUC12. HUC12 area outside CONUS counties (ocean, Canada, Mexico) is dropped. wtr_total_withdrawal_mgd = public
    supply (pswdtot) + crop irrigation (irrwdtot) + thermoelectric fresh (tewdftot) + thermoelectric saline (tewdssw).
    NWAA does not model industrial, mining, livestock, aquaculture or domestic self-supplied use, so this is NOT
    the full USGS 'total withdrawals' of the legacy 5-year compilations. Component columns wtr_ps/irr/te_withdrawal_mgd
    are kept. 0 HUC12s had values but no geometry and were dropped.
  download_date: '2026-10-04'
  raw_files:
  - data/raw/usgs_nwaa/huc12_2020_withdrawals.csv
wildfire_risk:
  name: Wildfire Risk to Communities - county download
  url: https://wildfirerisk.org/wp-content/uploads/2026/04/wrc_download_20260415.xlsx
  landing_page: https://wildfirerisk.org/download/
  vintage: 2026-04-15 release
  license: Public domain (USDA Forest Service)
  notes: '''Risk to homes'' = RISK_NATIONAL_RANK, the national percentile of the county''s mean Risk to Potential
    Structures (RPS); stored as 0-100.'
  download_date: '2026-10-03'
  raw_files:
  - data/raw/wildfire_risk/wrc_download_20260415.xlsx
wri_aqueduct40:
  name: WRI Aqueduct 4.0 water risk data (baseline annual + future annual)
  url: https://files.wri.org/aqueduct/aqueduct-4-0-water-risk-data.zip
  landing_page: https://www.wri.org/data/aqueduct-global-maps-40-data
  vintage: Aqueduct 4.0, release Y2023M07D05 (baseline 1979-2019; future 2050)
  license: CC BY 4.0 (World Resources Institute)
  notes: wtr_bws_score = baseline annual bws_score (0-5) from the 'baseline_annual' layer (HydroBASINS level 6 x
    GADM admin-1 units). wtr_bws_2050_score = bau50_ws_x_s from 'future_annual' (business-as-usual = SSP3-7.0, 2050).
    Negative sentinel scores -> NaN. Area-weighted overlay onto counties in EPSG:5070.
  download_date: '2026-10-03'
  raw_files:
  - data/raw/wri_aqueduct/aqueduct-4-0-water-risk-data.zip
